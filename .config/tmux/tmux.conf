##### ------------------------------------------------------------------
##### SHELL CONFIGURATION
##### ------------------------------------------------------------------

# Use Bash as the default shell for all panes
set-option -g default-shell /usr/bin/bash
set-option -g default-command /usr/bin/bash


##### ------------------------------------------------------------------
##### TERMINAL & GENERAL OPTIONS
##### ------------------------------------------------------------------

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:TC"

# Enable mouse support (pane resize, selection, etc.)
set -g mouse on

# Sync tmux clipboard with system clipboard
set -g set-clipboard on


##### ------------------------------------------------------------------
##### PREFIX KEY CONFIGURATION
##### ------------------------------------------------------------------

# Replace default prefix (C-b) with C-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix


##### ------------------------------------------------------------------
##### PANE SPLITTING (Preserve Current Working Directory)
##### ------------------------------------------------------------------

# Unbind default split keys
unbind %
unbind '"'

# Horizontal splits
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Vertical splits
bind - split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"


##### ------------------------------------------------------------------
##### VIM-STYLE PANE NAVIGATION
##### ------------------------------------------------------------------

# Navigate panes using prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes without prefix using Alt + h/j/k/l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R


##### ------------------------------------------------------------------
##### RESIZE PANES (Ctrl + Alt + h/j/k/l)
##### ------------------------------------------------------------------

bind -n C-M-h resize-pane -L 1
bind -n C-M-j resize-pane -D 1
bind -n C-M-k resize-pane -U 1
bind -n C-M-l resize-pane -R 1


##### ------------------------------------------------------------------
##### WINDOW INDEXING
##### ------------------------------------------------------------------

# Start window and pane numbering from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Automatically renumber windows after closing one
set-option -g renumber-windows on


##### ------------------------------------------------------------------
##### QUICK WINDOW SELECTION (Alt + number)
##### ------------------------------------------------------------------

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7


##### ------------------------------------------------------------------
##### CONFIG RELOAD
##### ------------------------------------------------------------------

# Reload tmux configuration file
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf


##### ------------------------------------------------------------------
##### COPY MODE (VIM-STYLE)
##### ------------------------------------------------------------------

# Use vi-style key bindings in copy mode
set-window-option -g mode-keys vi

# Begin selection with 'v'
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Toggle rectangular selection with Ctrl+v
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy selection and exit copy mode with 'y'
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Disable mouse drag auto-copy behavior
unbind -T copy-mode-vi MouseDragEnd1Pane


##### ------------------------------------------------------------------
##### TOKYONIGHT MOON COLOR PALETTE
##### ------------------------------------------------------------------

thm_bg="#222436"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_pink="#ff757f"
thm_red="#ff757f"
thm_green="#c3e88d"
thm_yellow="#ffc777"
thm_blue="#82aaff"
thm_orange="#ff9e64"
thm_black4="#444a73"


##### ------------------------------------------------------------------
##### STATUS BAR
##### ------------------------------------------------------------------

set -g status on
set -g status-bg "${thm_bg}"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Left side intentionally empty
set -g status-left ""


##### ------------------------------------------------------------------
##### MESSAGE STYLING
##### ------------------------------------------------------------------

set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"


##### ------------------------------------------------------------------
##### PANE STYLING
##### ------------------------------------------------------------------

set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"


##### ------------------------------------------------------------------
##### WINDOW STYLING
##### ------------------------------------------------------------------

set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""


##### ------------------------------------------------------------------
##### CURRENT WINDOW FORMAT
##### ------------------------------------------------------------------

set -g window-status-current-format \
"#[fg=${thm_blue},bg=${thm_bg}] #I: \
#[fg=${thm_magenta},bg=${thm_bg}](✓) \
#[fg=${thm_cyan},bg=${thm_bg}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev)"


##### ------------------------------------------------------------------
##### OTHER WINDOWS FORMAT
##### ------------------------------------------------------------------

set -g window-status-format \
"#[fg=${thm_blue},bg=${thm_bg}] #I: \
#[fg=${thm_fg},bg=${thm_bg}]#W"


##### ------------------------------------------------------------------
##### RIGHT STATUS SEGMENT
##### ------------------------------------------------------------------

set -g status-right \
"#[fg=${thm_blue},bg=${thm_bg}]\
#[fg=${thm_bg},bg=${thm_blue}] \
#[fg=${thm_fg},bg=${thm_gray}] #W \
#{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}\
#[bg=${thm_gray}]\
#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}\
#[fg=${thm_bg}] \
#[fg=${thm_fg},bg=${thm_gray}] #S "


##### ------------------------------------------------------------------
##### MODE & CLOCK
##### ------------------------------------------------------------------

set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"

